<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Network Copy</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-group toolbar-actions">
        <button id="copy-btn" type="button" disabled>
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="5" y="5" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span id="copy-btn-label">Copy (0)</span>
        </button>
        <button id="select-all-btn" type="button">
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M5 8l2.5 2.5L11 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Select all
        </button>
        <button id="clear-selection-btn" type="button">
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="3" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" />
            <path d="M6 6l4 4M10 6l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Clear selection
        </button>
        <button id="clear-list-btn" type="button">
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 5h9M6 5V3.5h4V5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M5 5l.8 7h4.4L11 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          Empty List
        </button>
      </div>

      <div class="toolbar-group toolbar-options">
        <label class="option">
          <input id="include-headers" type="checkbox" />
          Include headers
        </label>

        <label class="option truncate-option">
          <input id="truncate-enabled" type="checkbox" checked />
          Truncate bodies over
          <input
            id="truncate-mb"
            type="number"
            min="0.1"
            max="100"
            step="0.1"
            value="3"
            aria-label="Truncation size in megabytes"
          />
          MB
        </label>
      </div>
    </header>

    <div class="filter-bar">
      <input
        id="url-filter"
        type="search"
        placeholder="Filter by URL"
        spellcheck="false"
        aria-label="Filter by URL"
      />
      <button
        id="fetch-xhr-filter"
        type="button"
        class="filter-chip"
        aria-pressed="false"
      >
        Fetch/XHR
      </button>
      <label class="option preserve-log-option">
        <input id="preserve-log" type="checkbox" />
        Preserve log
      </label>
    </div>

    <div class="table-wrap">
      <table id="requests-table">
        <thead>
          <tr>
            <th class="col-check">
              <input id="header-checkbox" type="checkbox" title="Select all visible" />
            </th>
            <th class="col-method">Method</th>
            <th class="col-status">Status</th>
            <th class="col-type">Type</th>
            <th class="col-url">URL</th>
            <th class="col-size">Size</th>
          </tr>
        </thead>
        <tbody id="requests-body"></tbody>
      </table>
      <p id="empty-state" class="empty-state">
        No requests captured yet. Reload the page or interact with it while DevTools is open.
      </p>
      <p id="filter-empty-state" class="empty-state hidden">
        No requests match the current filter.
      </p>
    </div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <div id="preview-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-panel">
        <header class="modal-header">
          <h2 id="preview-modal-title">Preview</h2>
          <button id="preview-modal-close" type="button" class="modal-close-btn" aria-label="Close">&times;</button>
        </header>
        <pre id="preview-modal-body" class="modal-body"></pre>
        <footer class="modal-footer">
          <button id="preview-modal-copy" type="button">Copy</button>
          <button id="preview-modal-close-footer" type="button" data-close-modal>Close</button>
        </footer>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
